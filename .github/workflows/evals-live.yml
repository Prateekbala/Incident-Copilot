name: Live evals

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      trials:
        description: Trials per case
        default: "3"

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Judge calibration (Cohen's kappa vs human labels)
        run: npm run eval:judge-calibration -- --record
      - name: Live evals with LLM judge
        run: npx tsx evals/cli.ts --mode live --record --judge --trials ${{ inputs.trials || '3' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-results
          path: |
            evals/results/
            evals/cassettes/
